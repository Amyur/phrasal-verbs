<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phrasal Verbs — Amy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0f0f1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
  }

  h1 {
    color: #fff;
    font-size: 24px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* —— Tab radio buttons (hidden) —— */
  input.tab-radio { display: none; }

  /* —— Tab bar —— */
  .tab-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    max-width: 600px;
    width: 100%;
  }
  .tab-bar label {
    flex: 1;
    padding: 10px 14px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    background: #1a1a2e;
    color: #666;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid #2a2a4a;
    transition: all .2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-bar label .count {
    display: inline-block;
    background: #2a2a4a;
    color: #888;
    border-radius: 50px;
    padding: 1px 8px;
    font-size: 11px;
    margin-left: 6px;
    transition: all .2s;
  }
  #tab-phrasal:checked ~ .tab-bar label[for="tab-phrasal"],
  #tab-shopping:checked ~ .tab-bar label[for="tab-shopping"] {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    color: #fff;
    border-color: #4a6fa5;
    box-shadow: 0 0 12px rgba(74,111,165,.25);
  }
  #tab-phrasal:checked ~ .tab-bar label[for="tab-phrasal"] .count,
  #tab-shopping:checked ~ .tab-bar label[for="tab-shopping"] .count {
    background: #2a3a5a;
    color: #aac;
  }

  /* —— Tab content containers —— */
  .tab-content {
    display: none;
    max-width: 600px;
    width: 100%;
  }
  #tab-phrasal:checked ~ .tab-content.tab-phrasal { display: block; }
  #tab-shopping:checked ~ .tab-content.tab-shopping { display: block; }

  /* —— Card grid —— */
  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
  }

  /* —— Card using checkbox hack (pure CSS, 0 JS) —— */
  .card { position: relative; }
  .card input[type="checkbox"] { display: none; }
  .card label {
    display: block;
    cursor: pointer;
    border-radius: 14px;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card-front, .card-back {
    padding: 28px 18px;
    text-align: center;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .card-front {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border: 1px solid #2a2a4a;
    border-radius: 14px;
  }
  .card-front .verb {
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .card-front .tap-label {
    font-size: 11px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 12px;
  }

  .card-back {
    background: linear-gradient(145deg, #fafafa, #f0f0f5);
    border: 1px solid #ddd;
    border-radius: 14px;
    display: none;
  }
  .card-back .meaning {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 2px;
  }
  .card-back .meaning-alt {
    font-size: 14px;
    color: #888;
    margin-bottom: 10px;
  }
  .card-back .example {
    font-size: 14px;
    color: #555;
    font-style: italic;
    line-height: 1.5;
  }
  .card-back .example strong {
    font-style: normal;
    color: #16213e;
  }

  /* —— Checked state: hide front, show back —— */
  .card input:checked ~ label .card-front { display: none; }
  .card input:checked ~ label .card-back { display: flex; }

  /* —— Shopping tab: green accent —— */
  #tab-shopping:checked ~ .tab-content.tab-shopping .card-front {
    background: linear-gradient(145deg, #1a2e1a, #163e16);
    border-color: #2a4a2a;
  }
  #tab-shopping:checked ~ .tab-content.tab-shopping .card-back .meaning { color: #1a3e1a; }
  #tab-shopping:checked ~ .tab-content.tab-shopping .card-back .example strong { color: #1a3e1a; }

  /* —— Tab icon in subtitle —— */
  .tab-subtitle {
    color: #555;
    font-size: 12px;
    text-align: center;
    margin-top: 4px;
  }
  #tab-phrasal:checked ~ .tab-content.tab-phrasal .tab-subtitle,
  #tab-shopping:checked ~ .tab-content.tab-shopping .tab-subtitle { display: block; }

  /* —— Responsive —— */
  @media (max-width: 500px) {
    .card-grid { grid-template-columns: 1fr; max-width: 340px; }
  }
</style>
</head>
